name: CV validation

on:
  push:
    branches:
      - main
      - cv-professional-update
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium and PDF utilities
        run: |
          npx --yes playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-start.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:3000/cv?lang=en" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail "http://127.0.0.1:3000/cv?lang=en" > /dev/null
      - name: Generate and verify all four one-page PDFs
        run: |
          export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x | head -n 1)"
          test -n "$CHROMIUM_PATH"
          npm run pdf:cv:all
          npm run pdf:ats:all
          for pdf in \
            public/cv/Oualid_Ait_Alla_CV_EN.pdf \
            public/cv/Oualid_Ait_Alla_CV_FR.pdf \
            public/cv/Oualid_Ait_Alla_ATS_CV_EN.pdf \
            public/cv/Oualid_Ait_Alla_ATS_CV_FR.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            echo "$pdf: $pages page(s)"
            test "$pages" = "1"
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          files = [
              Path("public/cv/Oualid_Ait_Alla_CV_EN.pdf"),
              Path("public/cv/Oualid_Ait_Alla_CV_FR.pdf"),
              Path("public/cv/Oualid_Ait_Alla_ATS_CV_EN.pdf"),
              Path("public/cv/Oualid_Ait_Alla_ATS_CV_FR.pdf"),
          ]
          for pdf in files:
              extracted = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
              assert extracted.strip(), f"No selectable text extracted from {pdf}"
              assert "AIT ALLA Oualid" in extracted, f"CV name missing from extracted text: {pdf}"
              print(f"{pdf}: selectable text verified ({len(extracted)} characters)")

              bbox = subprocess.check_output(["pdftotext", "-bbox", str(pdf), "-"], text=True)
              page = re.search(r'<page width="([0-9.]+)" height="([0-9.]+)">', bbox)
              words = re.findall(r'<word xMin="([0-9.]+)" yMin="([0-9.]+)" xMax="([0-9.]+)" yMax="([0-9.]+)">', bbox)
              assert page and words, f"Could not inspect PDF text geometry: {pdf}"
              page_height = float(page.group(2))
              last_y = max(float(word[3]) for word in words)
              print(f"{pdf}: last text baseline region ends {page_height - last_y:.1f}pt from page edge")

          for pdf in files:
              extracted = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
              if pdf.name.endswith("_EN.pdf"):
                  title, date, organization = "AI Engineering Intern", "Aug 2026", "SPORTScore SAS"
              else:
                  title, date, organization = "Stagiaire ingénieur", "Août 2026", "SPORTScore SAS"
              section = "Professional Experience" if pdf.name.endswith("_EN.pdf") else "Expérience professionnelle"
              section_pos = extracted.find(section)
              title_pos = extracted.find(title, section_pos + len(section))
              date_pos = extracted.find(date, title_pos + len(title))
              organization_pos = extracted.find(organization, date_pos + len(date))
              print(f"{pdf}: extracted experience snippet: {extracted[section_pos:section_pos + 650]!r}")
              print(f"{pdf}: positions section={section_pos}, title={title_pos}, date={date_pos}, organization={organization_pos}")
              assert section_pos >= 0 and title_pos > section_pos and date_pos > title_pos and organization_pos > date_pos, (
                  f"Internship title/date/organization extraction order is incorrect in {pdf}"
              )
              print(f"{pdf}: title -> date -> organization reading order verified")
          PY
          done
