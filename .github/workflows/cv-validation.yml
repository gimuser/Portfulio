name: CV validation

on:
  push:
    branches:
      - main
      - cv-professional-update
      - cv-content-layout-2026-11-07
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium and PDF utilities
        run: |
          npx --yes playwright install chromium
          sudo apt-get install -y poppler-utils
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-start.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:3000/cv?lang=en" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail "http://127.0.0.1:3000/cv?lang=en" > /dev/null
      - name: Generate and verify all four one-page PDFs
        run: |
          export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x | head -n 1)"
          test -n "$CHROMIUM_PATH"
          npm run pdf:cv:all
          npm run pdf:ats:all
          page_failure=0
          for pdf in \
            public/cv/Oualid_Ait_Alla_CV.pdf \
            public/cv/Oualid_Ait_Alla_CV_FR.pdf \
            public/cv/Oualid_Ait_Alla_ATS_CV_EN.pdf \
            public/cv/Oualid_Ait_Alla_ATS_CV_FR.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            echo "$pdf: $pages page(s)"
            if [ "$pages" != "1" ]; then page_failure=1; fi
          done
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          files = [
              Path("public/cv/Oualid_Ait_Alla_CV.pdf"),
              Path("public/cv/Oualid_Ait_Alla_CV_FR.pdf"),
              Path("public/cv/Oualid_Ait_Alla_ATS_CV_EN.pdf"),
              Path("public/cv/Oualid_Ait_Alla_ATS_CV_FR.pdf"),
          ]
          for pdf in files:
              extracted = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
              assert extracted.strip(), f"No selectable text extracted from {pdf}"
              assert "AIT ALLA Oualid" in extracted, f"CV name missing from extracted text: {pdf}"
              print(f"{pdf}: selectable text verified ({len(extracted)} characters)")
              lines = [line.strip() for line in extracted.splitlines() if line.strip()]
              longest = max(lines, key=len)
              print(f"{pdf}: longest extracted line = {len(longest)} characters")

              if "ATS_CV" in pdf.name:
                  print(f"{pdf}: photo = none (ATS version)")
              else:
                  image_listing = subprocess.check_output(["pdfimages", "-list", str(pdf)], text=True)
                  image_rows = [line.split() for line in image_listing.splitlines()
                                if len(line.split()) >= 14 and line.split()[2] == "image"]
                  assert image_rows, f"Photo image not found in visual CV: {pdf}"
                  photo = max(image_rows, key=lambda row: int(row[3]) * int(row[4]))
                  width_mm = int(photo[3]) / float(photo[12]) * 25.4
                  height_mm = int(photo[4]) / float(photo[13]) * 25.4
                  print(f"{pdf}: visible photo box = 26.0 x 32.0 mm (CSS); embedded bitmap = {width_mm:.1f} x {height_mm:.1f} mm")
                  assert abs(width_mm - 26) < 1.5, (
                      f"Embedded photo width is outside tolerance in {pdf}: {width_mm:.1f} mm"
                  )

              if pdf.name == "Oualid_Ait_Alla_CV.pdf":
                  page_count = int(subprocess.check_output(["pdfinfo", str(pdf)], text=True).split("Pages:")[1].splitlines()[0].strip())
                  for page_number in range(1, page_count + 1):
                      page_text = subprocess.check_output(
                          ["pdftotext", "-f", str(page_number), "-l", str(page_number), str(pdf), "-"],
                          text=True,
                      )
                      print(f"{pdf}: PAGE {page_number} TEXT:", " | ".join(page_text.split()))

              bbox = subprocess.check_output(["pdftotext", "-bbox", str(pdf), "-"], text=True)
              page = re.search(r'<page width="([0-9.]+)" height="([0-9.]+)">', bbox)
              words = re.findall(r'<word xMin="([0-9.]+)" yMin="([0-9.]+)" xMax="([0-9.]+)" yMax="([0-9.]+)">', bbox)
              assert page and words, f"Could not inspect PDF text geometry: {pdf}"
              page_height = float(page.group(2))
              last_y = max(float(word[3]) for word in words)
              print(f"{pdf}: last text baseline region ends {page_height - last_y:.1f}pt from page edge")

          for pdf in files:
              extracted = subprocess.check_output(["pdftotext", str(pdf), "-"], text=True)
              is_french = "_FR.pdf" in pdf.name
              if is_french:
                  title, date, organization = "Stagiaire ingénieur", "août 2026", "SPORTScore SAS"
                  section = "Expérience professionnelle"
              else:
                  title, date, organization = "AI Engineering Intern", "Aug 2026", "SPORTScore SAS"
                  section = "Professional Experience"
              layout_extracted = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True)
              folded = " ".join(layout_extracted.casefold().split())
              section_pos = folded.find(section.casefold())
              title_pos = folded.find(title.casefold(), section_pos + len(section))
              date_pos = folded.find(date.casefold(), title_pos + len(title))
              organization_pos = folded.find(organization.casefold(), date_pos + len(date))
              print(f"{pdf}: positions section={section_pos}, title={title_pos}, date={date_pos}, organization={organization_pos}")
              if pdf.name == "Oualid_Ait_Alla_CV.pdf":
                  print("EXTRACTED TEXT:", " | ".join(extracted.split()))
              assert section_pos >= 0 and title_pos > section_pos and date_pos > title_pos and organization_pos > date_pos, (
                  f"Internship title/date/organization extraction order is incorrect in {pdf}"
              )
              print(f"{pdf}: title -> date -> organization reading order verified")
          PY
          test "$page_failure" = "0"


      - name: Upload generated CV PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            public/cv/Oualid_Ait_Alla_CV.pdf
            public/cv/Oualid_Ait_Alla_CV_FR.pdf
            public/cv/Oualid_Ait_Alla_ATS_CV_EN.pdf
            public/cv/Oualid_Ait_Alla_ATS_CV_FR.pdf
          if-no-files-found: error
